name: zapsound
description: Play funny sounds when you plug or unplug your charger.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  in_app_purchase: ^3.2.0
  permission_handler: ^11.1.0
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
